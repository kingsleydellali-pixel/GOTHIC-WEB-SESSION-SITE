<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GOTHIC MD BOT V6</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 30px 16px;
      font-family: 'Roboto', 'Segoe UI', sans-serif;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.78)),
        url("https://i.ibb.co/wh9WHVzQ/ERFAN-MD.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* ---------- Title ---------- */
    .brand {
      text-align: center;
      margin-bottom: 34px;
      animation: fadeIn .9s ease both;
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(26, 111, 212, .95), 0 0 34px rgba(26, 111, 212, .55);
    }

    .brand p {
      margin: 8px 0 0;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9fc0e8;
    }

    .brand .line {
      width: 120px;
      height: 2px;
      margin: 14px auto 0;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #1a6fd4, transparent);
    }

    /* ---------- Buttons ---------- */
    .btn {
      --color: #e5f5f1;
      --color2: rgb(0, 0, 0);
      width: 200px;
      padding: 0.8em 1.75em;
      background-color: #1a6fd4;
      border-radius: 6px;
      border: .3px solid var(--color);
      transition: .5s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      z-index: 1;
      font-weight: 300;
      font-size: 17px;
      font-family: 'Roboto', 'Segoe UI', sans-serif;
      text-transform: uppercase;
      color: var(--color);
      margin-bottom: 24px;
      letter-spacing: 0.06em;
    }

    .btn::after, .btn::before {
      content: '';
      display: block;
      height: 100%;
      width: 100%;
      transform: skew(90deg) translate(-50%, -50%);
      position: absolute;
      inset: 50%;
      left: 25%;
      z-index: -1;
      transition: .5s ease-out;
      background-color: var(--color);
    }

    .btn::before {
      top: -50%;
      left: -25%;
      transform: skew(90deg) rotate(180deg) translate(-50%, -50%);
    }

    .btn:hover::before {
      transform: skew(45deg) rotate(180deg) translate(-50%, -50%);
    }

    .btn:hover::after {
      transform: skew(45deg) translate(-50%, -50%);
    }

    .btn:hover {
      color: var(--color2);
      box-shadow: 0 0 22px rgba(26, 111, 212, .8);
    }

    .btn:active {
      filter: brightness(.7);
      transform: scale(.98);
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="brand">
    <h1>GOTHIC MD BOT V6</h1>
    <p>WhatsApp Session Generator</p>
    <div class="line"></div>
  </div>

  <button onclick="window.open(`/pair.html`)" class="btn">PAIR CODE</button>
  <button onclick="window.open(`/qr`)" class="btn">QR SCAN</button>
  <button onclick="window.open(`https://github.com/kingsleydellali-pixel/GOTHIC-WEB-SESSION-SITE/fork`)" class="btn">REPO FORK</button>

  <footer>© GOTHIC MD BOT V6</footer>

</body>
</html>
